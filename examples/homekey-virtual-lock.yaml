#   - alias: "HomeKey zár -> valódi zár"
#     mode: queued
#     triggers:
#       - trigger: state
#         entity_id: lock.homekey_reader_homekey_zar
#         to: [locked, unlocked]
#     actions:
#       - if:
#           - condition: state
#             entity_id: lock.homekey_reader_homekey_zar
#             state: unlocked
#         then:
#           - action: lock.unlock
#             target:
#               entity_id: lock.front_door
#         else:
#           - action: lock.lock
#             target:
#               entity_id: lock.front_door
